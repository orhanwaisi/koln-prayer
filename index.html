<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پڕۆژەی قورئانی پیرۆز - تەفسیر بە دەنگ</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
        }
        button:hover {
            background-color: #0056b3;
        }
        .verse-card {
            background: #fdfdfd;
            border: 1px solid #e1e1e1;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        .arabic-text {
            font-size: 20px;
            font-weight: bold;
            color: #1a5276;
            margin-bottom: 10px;
        }
        .translation-text {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
        }
        .btn-audio {
            background-color: #28a745;
        }
        .btn-audio:hover {
            background-color: #218838;
        }
        .btn-stop {
            background-color: #dc3545;
        }
        .btn-stop:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>قورئانی پیرۆز و تەفسیر بە دەنگ</h1>

        <!-- بەشی کۆنترۆڵ و هەڵبژاردنی سوورەت و زمان -->
        <div class="controls">
            <label for="surahSelect">سوورەت:</label>
            <select id="surahSelect" onchange="loadSurah()">
                <option value="1">الفاتحة (1)</option>
                <option value="2">البقرة (نموونەی سەرەتایی)</option>
            </select>

            <label for="langSelect">زمانی خوێندنەوە:</label>
            <select id="langSelect">
                <option value="ku-IQ">کوردی (Kurdish)</option>
                <option value="ar-SA">عەرەبی (Arabic)</option>
                <option value="fa-IR">فارسی (Persian)</option>
                <option value="de-DE">ئەڵمانی (German)</option>
            </select>
        </div>

        <!-- لیستی ئایەتەکان -->
        <div id="versesContainer">
            <p style="text-align: center;">فەرموون چاوەڕێ بکەن، داتا دەهێنرێت...</p>
        </div>
    </div>

    <script>
        // هێنانی ئایەتەکان لە API فەرمی قورئان
        async function loadSurah() {
            const surahId = document.getElementById('surahSelect').value;
            const container = document.getElementById('versesContainer');
            container.innerHTML = '<p style="text-align: center;">ئایەتەکان باردەکرێن...</p>';

            try {
                // هێنانی دەقی عەرەبی و وەرگێڕانی ئینگلیزی/کوردی ئەگەر بەردەست بێت، لێرە عەرەبی و وەرگێڕان بەکاردەهێنین
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}`);
                const data = await response.json();
                
                if(data.code === 200) {
                    const ayahs = data.data.ayahs;
                    container.innerHTML = '';

                    ayahs.forEach((ayah, index) => {
                        // دەتوانیت لێرە دەقی تەفسیر یان وەرگێڕان دابنێیت
                        let translationText = `ئەمە دەقی وەرگێڕان یان تەفسیری ئایەتی ژمارە ${ayah.numberInSurah}ە لە سوورەتی ${data.data.englishName}.`;

                        const card = document.createElement('div');
                        card.className = 'verse-card';
                        card.innerHTML = `
                            <div class="arabic-text">(${ayah.numberInSurah}) ${ayah.text}</div>
                            <div class="translation-text" id="trans-${index}">${translationText}</div>
                            <button class="btn-audio" onclick="playSpeech('trans-${index}')">🔊 خوێندنەوەی دەنگ</button>
                            <button class="btn-stop" onclick="stopSpeech()">⏹️ وەستاندن</button>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                container.innerHTML = '<p style="text-align: center; color: red;">هەڵەیەک ڕوویدا لە هێنانی زانیارییەکان.</p>';
                console.error(error);
            }
        }

        // فەنکشنی خوێندنەوەی دەق بە دەنگ (Text-to-Speech)
        function playSpeech(elementId) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // وەستاندنی هەر دەنگێکی پێشوو

                const text = document.getElementById(elementId).innerText;
                const selectedLang = document.getElementById('langSelect').value;

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = selectedLang;
                utterance.rate = 1.0; // خێرایی
                utterance.pitch = 1.0; // بەرزی دەنگ

                window.speechSynthesis.speak(utterance);
            } else {
                alert('وێبگەڕەکەت پشتگیری تایبەتمەندی دەنگ ناکات.');
            }
        }

        // فەنکشنی وەستاندنی دەنگ
        function stopSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        // جێبەجێکردنی یەکەم جار لە کاتی کردنەوەی پەڕەکەدا
        window.onload = function() {
            loadSurah();
        };
    </script>

</body>
</html>
